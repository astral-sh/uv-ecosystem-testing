[project]
name = "uv-ecosystem-testing"
version = "0.1.0"
description = "Testing uv on a larger number of ecosystem projects"
readme = "Readme.md"
requires-python = ">=3.14"
license = "MIT OR Apache-2.0"
dependencies = [
    "httpx2>=2.0.0,<3.0.0",
    "tomli-w>=1.2.0,<2.0.0",
    "tqdm>=4.67.1,<5.0.0",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.15.0,<0.16.0",
    "ty>=0.0.23,<0.1.0",
]

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.uv]
exclude-newer = "P7D"
no-build = true
require-build-hashes = true
# The container installs this project as a non-editable package.
no-binary-package = ["uv-ecosystem-testing"]
# Pin the isolated build environment for source-build exceptions.
build-constraint-dependencies = [
    { requirement = "uv-build==0.10.12", hashes = [
